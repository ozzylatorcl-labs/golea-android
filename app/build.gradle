plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.ozzylatorlabs.golea'
    compileSdk 36

    defaultConfig {
        applicationId 'cl.ozzylatorlabs.golea'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
