name: Build GOLEA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar GOLEA.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GOLEA.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GOLEA-Android-V1
          path: GOLEA.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 GOLEA.apk --clobber
          else
            gh release create v1.0 GOLEA.apk \
              --title "GOLEA Android V1.0" \
              --notes "Primera versión de prueba de GOLEA para Android."
          fi
